<p>contact works!</p>

@if (errMessage()) {
  <p class="text-danger" role="alert">{{ errMessage() }}</p>
} @else if (contact(); as info) {
  <table border="1">
    <tbody>
      <tr>
        <td>Name:</td>
        <td>{{ info.name }}</td>
      </tr>
      <tr>
        <td>Email:</td>
        <td>{{ info.email }}</td>
      </tr>
      <tr>
        <td>Phone:</td>
        <td>{{ info.phone }}</td>
      </tr>
    </tbody>
  </table>
} @else {
  <p>Loading contact...</p>
}
