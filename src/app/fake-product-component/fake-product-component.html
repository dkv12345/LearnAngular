<!-- Hiển thị thông báo lỗi nếu có -->
@if (errMessage()) {
  <div class="error-message" style="color: red; margin-bottom: 10px; font-weight: bold;">
    {{ errMessage() }}
  </div>
}

<table>
    <thead>
        <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Price</th>
            <th>Description</th>
            <th>Category</th>
            <th>Image</th>
            <th>Rating</th>
        </tr>
    </thead>
    <tbody>
      @for (p of products(); track p.id) {
        <tr>
            <td>{{p.id}}</td>
            <td>{{p.title}}</td>
            <td>{{p.price}}</td>
            <td>{{p.description}}</td>
            <td>{{p.category}}</td>
            <td><img [src]="p.image" width="100" height="100" alt="{{p.title}}"></td>
            <td>{{p.rating?.rate}}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="7">No products available.</td>
        </tr>
      }
    </tbody>
</table>
