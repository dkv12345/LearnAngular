<p>product-list-search-component works!</p>

@if (errMessage()) {
  <p style="color: red;">{{ errMessage() }}</p>
}

<label>Min Price:</label>
<input type="number" [(ngModel)]="minPrice">
<br/>

<label>Max Price:</label>
<input type="number" [(ngModel)]="maxPrice">
<br/><br/>

<button (click)="onFilter()">Filter Product</button>
<button (click)="onShowAll()" style="margin-left: 8px;">Show All</button>

<br/><br/>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Details</th>
      <th>Slug</th>
    </tr>
  </thead>
  <tbody>
    @for (p of filteredProducts(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
        <td>
          <a (click)="viewDetail(p.id)"
             style="cursor: pointer;"
             title="click here to view detail">View detail</a>
        </td>
        <td>
          <a (click)="viewDetailSlug(p)"
             style="cursor: pointer;"
             title="click here to view detail">
            {{ generateSlug(p.name, p.id) }}
          </a>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" style="text-align: center;">No products available.</td>
      </tr>
    }
  </tbody>
</table>
