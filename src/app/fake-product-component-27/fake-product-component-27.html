@if (errMessage()) {
  <div class="alert alert-danger m-3" role="alert">{{ errMessage() }}</div>
}

<h3 class="text-center text-white bg-dark p-3">Product List</h3>

<div class="container py-3">
  <div class="row g-4">
    @for (p of products(); track p.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="img-container">
            <div class="d-flex justify-content-between align-items-center p-2 first">
              <span class="percent">-25%</span>
              <span class="wishlist" aria-label="Add to wishlist">♥</span>
            </div>
            <div class="text-center">
              <img [src]="p.image" [alt]="p.title" class="img-scale" />
            </div>
          </div>

          <div class="product-detail-container">
            <h6 class="mb-0 text-truncate">{{ p.title }}</h6>
            <div>
              <span class="text-danger fw-bold">${{ p.price }}</span>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
              <div class="ratings">
                <span aria-hidden="true">★</span>
                <span>{{ p.rating.rate }}</span>
              </div>
              <div class="count">Count: {{ p.rating.count }}</div>
            </div>
            <div class="mt-3">
              <button type="button" class="btn btn-warning d-block w-100 text-white fw-bold">
                Buy Now
              </button>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col">
        <p class="text-center text-muted">No products available.</p>
      </div>
    }
  </div>
</div>
